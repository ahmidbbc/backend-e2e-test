<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestion des commandes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Gestion des commandes</h1>
    </header>

    <main>
      <section id="orders">
        <div class="orders-head">
          <h2>Commandes clients</h2>
          <span id="orders-count" class="orders-count" hidden></span>
        </div>
        <p id="orders-status">Chargement des commandes…</p>
        <ul id="orders-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; Gestion des commandes</p>
    </footer>

    <script>
      const STATUS_LABELS = {
        pending: 'En attente',
        shipped: 'Expédiée',
        delivered: 'Livrée',
      };

      function formatDate(value) {
        if (!value) return '';
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return String(value);
        return parsed.toLocaleDateString('fr-FR', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
        });
      }

      function renderOrder(order) {
        const item = document.createElement('li');
        item.className = 'order-card';

        const head = document.createElement('div');
        head.className = 'order-head';

        const customer = document.createElement('span');
        customer.className = 'order-customer';
        customer.textContent = order.customer;

        const badge = document.createElement('span');
        badge.className = `order-status status-${order.status}`;
        badge.textContent = STATUS_LABELS[order.status] || order.status;

        head.append(customer, badge);

        const meta = document.createElement('div');
        meta.className = 'order-meta';

        const ref = document.createElement('span');
        ref.className = 'order-ref';
        ref.textContent = `Commande #${order.id}`;

        const date = document.createElement('span');
        date.className = 'order-date';
        date.textContent = formatDate(order.date);

        const total = document.createElement('span');
        total.className = 'order-total';
        total.textContent = `${Number(order.total).toFixed(2)} €`;

        meta.append(ref, date, total);
        item.append(head, meta);
        return item;
      }

      async function loadOrders() {
        const status = document.getElementById('orders-status');
        const list = document.getElementById('orders-list');
        const count = document.getElementById('orders-count');
        try {
          const res = await fetch('/api/orders');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const { orders } = await res.json();
          list.replaceChildren();
          if (!orders || orders.length === 0) {
            count.hidden = true;
            status.hidden = false;
            status.textContent = 'Aucune commande.';
            return;
          }
          status.hidden = true;
          count.hidden = false;
          count.textContent = `${orders.length} commande${orders.length > 1 ? 's' : ''}`;
          for (const order of orders) {
            list.append(renderOrder(order));
          }
        } catch (err) {
          count.hidden = true;
          status.hidden = false;
          status.textContent = 'Impossible de charger les commandes.';
        }
      }

      loadOrders();
    </script>
  </body>
</html>
